name: Build Android APK - Calculatrice facile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Calculatrice facile" com.kibwe.calculatricefacile --web-dir=. || true

      - name: Verify structure
        run: |
          ls -la
          ls -la images/
          test -f index.html && echo "✅ index.html OK" || echo "❌ index.html manquant"
          test -f images/icon.png && echo "✅ icon.png OK" || echo "❌ icon.png manquant"
          test -f images/splash.png && echo "✅ splash.png OK" || echo "❌ splash.png manquant"

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.kibwe.calculatricefacile",
            "appName": "Calculatrice facile",
            "webDir": ".",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 3000,
                "launchAutoHide": true,
                "backgroundColor": "#3B82F6",
                "androidScaleType": "CENTER_CROP",
                "showSpinner": false
              }
            }
          }
          EOF

      - name: Add Android platform
        run: |
          npx cap add android || echo "Android déjà là"
          npx cap copy android

      - name: Configure icons & splash
        run: |
          ICON_SRC="images/icon.png"
          for dir in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp "$ICON_SRC" android/app/src/main/res/$dir/ic_launcher.png
            cp "$ICON_SRC" android/app/src/main/res/$dir/ic_launcher_round.png
          done
          mkdir -p android/app/src/main/res/drawable
          cp images/splash.png android/app/src/main/res/drawable/splash.png || true

          cat > android/app/src/main/res/values/splash_theme.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme.Splash" parent="Theme.SplashScreen">
                  <item name="windowSplashScreenBackground">#3B82F6</item>
                  <item name="windowSplashScreenAnimatedIcon">@drawable/splash</item>
                  <item name="postSplashScreenTheme">@style/AppTheme</item>
              </style>
          </resources>
          EOF

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-facile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

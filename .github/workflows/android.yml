name: Générer un APK Android - Calculatrice facile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  construire:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: Installer les dépendances
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialisation Capacitor
        run: |
          rm -rf android capacitor.config.json
          npx cap init "Calculatrice facile" com.kibwe.calculatricefacile --web-dir=.

      - name: Ajouter Android
        run: |
          npx cap add android
          npx cap copy android

      - name: Injecter des icônes
        run: |
          if [ -f "images/icon.png" ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp images/icon.png android/app/src/main/res/$d/ic_launcher.png
              cp images/icon.png android/app/src/main/res/$d/ic_launcher_round.png
            done
          fi

      - name: CONSTRUCTION
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-facile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

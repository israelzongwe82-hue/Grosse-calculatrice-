name: Build Android APK - Calculatrice facile

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses || true

      - name: Install deps
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Init Capacitor
        run: |
          rm -rf android capacitor.config.json
          npx cap init "Calculatrice facile" com.kibwe.calculatricefacile --web-dir=.

      - name: Add Android
        run: |
          npx cap add android
          npx cap copy

      - name: Inject icons
        run: |
          if [ -f "images/icon.png" ]; then
            for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              mkdir -p android/app/src/main/res/$d
              cp images/icon.png android/app/src/main/res/$d/ic_launcher.png
              cp images/icon.png android/app/src/main/res/$d/ic_launcher_round.png
            done
          fi

      - name: BUILD WITH FULL LOG
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --info --no-daemon
        continue-on-error: false

      - name: Upload APK if success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculatrice-facile-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: android/app/build/
